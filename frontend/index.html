<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Online Exam Portal</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: #f0f4f8;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #1a202c;
    }
    .card {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      padding: 2.5rem;
      width: 100%;
      max-width: 420px;
    }
    h1 { font-size: 1.5rem; margin-bottom: 0.25rem; }
    .subtitle { color: #718096; font-size: 0.9rem; margin-bottom: 1.75rem; }
    label { display: block; font-size: 0.875rem; font-weight: 600; margin-bottom: 0.3rem; }
    input {
      width: 100%;
      padding: 0.6rem 0.75rem;
      border: 1px solid #cbd5e0;
      border-radius: 6px;
      font-size: 1rem;
      margin-bottom: 1rem;
    }
    input:focus { outline: 2px solid #4299e1; border-color: #4299e1; }
    .btn {
      width: 100%;
      padding: 0.7rem;
      background: #3182ce;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:hover { background: #2b6cb0; }
    .btn:focus { outline: 2px solid #2b6cb0; outline-offset: 2px; }
    .forgot { display: block; text-align: right; font-size: 0.8rem; color: #3182ce; margin-top: -0.5rem; margin-bottom: 1rem; }
    .error-msg { color: #c53030; font-size: 0.85rem; margin-bottom: 1rem; display: none; }
    .register-link { text-align: center; margin-top: 1rem; font-size: 0.875rem; }
    .register-link a { color: #3182ce; }
  </style>
</head>
<body>
  <main class="card" role="main">
    <h1>Online Exam Portal</h1>
    <p class="subtitle">Sign in to your account</p>

    <div id="error-msg" class="error-msg" role="alert" aria-live="polite"></div>

    <form id="login-form" novalidate>
      <label for="email">Email address</label>
      <input type="email" id="email" name="email" autocomplete="email" required aria-required="true" placeholder="you@example.com" />

      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required aria-required="true" placeholder="••••••••" />

      <a href="forgot-password.html" class="forgot">Forgot password?</a>

      <button type="submit" class="btn" aria-label="Sign in">Sign In</button>
    </form>

    <p class="register-link">Don't have an account? <a href="register.html">Register</a></p>
  </main>

  <script>
    const form = document.getElementById('login-form');
    const errorMsg = document.getElementById('error-msg');

    async function getCsrfToken() {
      const res = await fetch('/api/auth/csrf-token', { credentials: 'include' });
      const data = await res.json();
      return data.csrfToken;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.style.display = 'none';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        const csrfToken = await getCsrfToken();
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': csrfToken },
          credentials: 'include',
          body: JSON.stringify({ email, password }),
        });

        const data = await res.json();

        if (!res.ok) {
          errorMsg.textContent = data.error?.message || 'Login failed. Please try again.';
          errorMsg.style.display = 'block';
          return;
        }

        // Redirect based on role
        if (data.role === 'Student')  window.location.href = '/student/dashboard.html';
        if (data.role === 'Teacher')  window.location.href = '/teacher/dashboard.html';
        if (data.role === 'Admin')    window.location.href = '/admin/dashboard.html';
      } catch {
        errorMsg.textContent = 'Unable to connect to the server. Please try again.';
        errorMsg.style.display = 'block';
      }
    });
  </script>
</body>
</html>
