<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password — Online Exam Portal</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f0f4f8; display: flex; align-items: center; justify-content: center; min-height: 100vh; color: #1a202c; }
    .card { background: #fff; border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); padding: 2.5rem; width: 100%; max-width: 420px; }
    h1 { font-size: 1.4rem; margin-bottom: 0.25rem; }
    .subtitle { color: #718096; font-size: 0.875rem; margin-bottom: 1.75rem; }
    label { display: block; font-size: 0.875rem; font-weight: 600; margin-bottom: 0.3rem; }
    input { width: 100%; padding: 0.6rem 0.75rem; border: 1px solid #cbd5e0; border-radius: 6px; font-size: 1rem; margin-bottom: 1rem; }
    input:focus { outline: 2px solid #4299e1; }
    .btn { width: 100%; padding: 0.7rem; background: #3182ce; color: #fff; border: none; border-radius: 6px; font-size: 1rem; font-weight: 600; cursor: pointer; }
    .btn:hover { background: #2b6cb0; }
    .btn:focus { outline: 2px solid #2b6cb0; outline-offset: 2px; }
    .success-msg { color: #276749; background: #c6f6d5; padding: 0.75rem; border-radius: 6px; font-size: 0.875rem; margin-bottom: 1rem; display: none; }
    .error-msg   { color: #c53030; font-size: 0.85rem; margin-bottom: 1rem; display: none; }
    .back-link { display: block; text-align: center; margin-top: 1rem; font-size: 0.875rem; color: #3182ce; }
  </style>
</head>
<body>
  <main class="card" role="main">
    <h1>Forgot Password</h1>
    <p class="subtitle">Enter your email and we'll send you a reset link.</p>

    <div id="success-msg" class="success-msg" role="status" aria-live="polite"></div>
    <div id="error-msg"   class="error-msg"   role="alert"  aria-live="polite"></div>

    <form id="forgot-form" novalidate>
      <label for="email">Email address</label>
      <input type="email" id="email" name="email" autocomplete="email" required aria-required="true" placeholder="you@example.com" />
      <button type="submit" class="btn" aria-label="Send reset link">Send Reset Link</button>
    </form>

    <a href="/index.html" class="back-link">← Back to login</a>
  </main>

  <script>
    async function getCsrfToken() {
      const res = await fetch('/api/auth/csrf-token', { credentials: 'include' });
      return (await res.json()).csrfToken;
    }

    document.getElementById('forgot-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const successMsg = document.getElementById('success-msg');
      const errorMsg   = document.getElementById('error-msg');
      successMsg.style.display = 'none';
      errorMsg.style.display   = 'none';

      const email = document.getElementById('email').value.trim();

      try {
        const csrfToken = await getCsrfToken();
        const res = await fetch('/api/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': csrfToken },
          credentials: 'include',
          body: JSON.stringify({ email }),
        });
        const data = await res.json();
        if (res.ok) {
          successMsg.textContent = data.message;
          successMsg.style.display = 'block';
          document.getElementById('forgot-form').reset();
        } else {
          errorMsg.textContent = data.error?.message || 'Something went wrong.';
          errorMsg.style.display = 'block';
        }
      } catch {
        errorMsg.textContent = 'Unable to connect to the server.';
        errorMsg.style.display = 'block';
      }
    });
  </script>
</body>
</html>
