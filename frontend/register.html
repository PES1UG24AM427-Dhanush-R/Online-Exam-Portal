<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — Online Exam Portal</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f0f4f8; display: flex; align-items: center; justify-content: center; min-height: 100vh; color: #1a202c; }
    .card { background: #fff; border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); padding: 2.5rem; width: 100%; max-width: 420px; }
    h1 { font-size: 1.5rem; margin-bottom: 0.25rem; }
    .subtitle { color: #718096; font-size: 0.9rem; margin-bottom: 1.75rem; }
    label { display: block; font-size: 0.875rem; font-weight: 600; margin-bottom: 0.3rem; }
    input { width: 100%; padding: 0.6rem 0.75rem; border: 1px solid #cbd5e0; border-radius: 6px; font-size: 1rem; margin-bottom: 1rem; }
    input:focus { outline: 2px solid #4299e1; border-color: #4299e1; }
    .field-error { color: #c53030; font-size: 0.8rem; margin-top: -0.75rem; margin-bottom: 0.75rem; display: none; }
    .btn { width: 100%; padding: 0.7rem; background: #3182ce; color: #fff; border: none; border-radius: 6px; font-size: 1rem; font-weight: 600; cursor: pointer; }
    .btn:hover { background: #2b6cb0; }
    .btn:focus { outline: 2px solid #2b6cb0; outline-offset: 2px; }
    .success-msg { color: #276749; background: #c6f6d5; padding: 0.75rem; border-radius: 6px; font-size: 0.9rem; margin-bottom: 1rem; display: none; }
    .error-msg { color: #c53030; font-size: 0.85rem; margin-bottom: 1rem; display: none; }
    .login-link { text-align: center; margin-top: 1rem; font-size: 0.875rem; }
    .login-link a { color: #3182ce; }
  </style>
</head>
<body>
  <main class="card" role="main">
    <h1>Create Account</h1>
    <p class="subtitle">Register as a Student</p>

    <div id="success-msg" class="success-msg" role="status" aria-live="polite"></div>
    <div id="error-msg" class="error-msg" role="alert" aria-live="polite"></div>

    <form id="register-form" novalidate>
      <label for="fullName">Full name</label>
      <input type="text" id="fullName" name="fullName" autocomplete="name" required aria-required="true" placeholder="Jane Smith" />

      <label for="email">Email address</label>
      <input type="email" id="email" name="email" autocomplete="email" required aria-required="true" placeholder="you@example.com" />

      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="new-password" required aria-required="true" placeholder="Min 8 chars, 1 uppercase, 1 number" />

      <button type="submit" class="btn" aria-label="Create account">Create Account</button>
    </form>

    <p class="login-link">Already have an account? <a href="/index.html">Sign in</a></p>
  </main>

  <script>
    const form = document.getElementById('register-form');
    const successMsg = document.getElementById('success-msg');
    const errorMsg = document.getElementById('error-msg');

    async function getCsrfToken() {
      const res = await fetch('/api/auth/csrf-token', { credentials: 'include' });
      const data = await res.json();
      return data.csrfToken;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.style.display = 'none';
      successMsg.style.display = 'none';

      const fullName = document.getElementById('fullName').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        const csrfToken = await getCsrfToken();
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': csrfToken },
          credentials: 'include',
          body: JSON.stringify({ fullName, email, password }),
        });

        const data = await res.json();

        if (!res.ok) {
          const detail = data.error?.details?.map(d => d.message).join(' ') || data.error?.message;
          errorMsg.textContent = detail || 'Registration failed.';
          errorMsg.style.display = 'block';
          return;
        }

        successMsg.textContent = 'Account created successfully! Redirecting to login...';
        successMsg.style.display = 'block';
        setTimeout(() => { window.location.href = '/index.html'; }, 2000);
      } catch {
        errorMsg.textContent = 'Unable to connect to the server.';
        errorMsg.style.display = 'block';
      }
    });
  </script>
</body>
</html>
