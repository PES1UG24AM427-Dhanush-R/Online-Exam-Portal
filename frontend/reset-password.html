<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — Online Exam Portal</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f0f4f8; display: flex; align-items: center; justify-content: center; min-height: 100vh; color: #1a202c; }
    .card { background: #fff; border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); padding: 2.5rem; width: 100%; max-width: 420px; }
    h1 { font-size: 1.4rem; margin-bottom: 0.25rem; }
    .subtitle { color: #718096; font-size: 0.875rem; margin-bottom: 1.75rem; }
    label { display: block; font-size: 0.875rem; font-weight: 600; margin-bottom: 0.3rem; }
    input { width: 100%; padding: 0.6rem 0.75rem; border: 1px solid #cbd5e0; border-radius: 6px; font-size: 1rem; margin-bottom: 1rem; }
    input:focus { outline: 2px solid #4299e1; }
    .btn { width: 100%; padding: 0.7rem; background: #3182ce; color: #fff; border: none; border-radius: 6px; font-size: 1rem; font-weight: 600; cursor: pointer; }
    .btn:hover { background: #2b6cb0; }
    .btn:focus { outline: 2px solid #2b6cb0; outline-offset: 2px; }
    .success-msg { color: #276749; background: #c6f6d5; padding: 0.75rem; border-radius: 6px; font-size: 0.875rem; margin-bottom: 1rem; display: none; }
    .error-msg   { color: #c53030; font-size: 0.85rem; margin-bottom: 1rem; display: none; }
    .invalid-token { text-align: center; color: #c53030; padding: 1rem 0; display: none; }
  </style>
</head>
<body>
  <main class="card" role="main">
    <h1>Reset Password</h1>
    <p class="subtitle">Enter your new password below.</p>

    <div id="invalid-token" class="invalid-token" role="alert">
      This reset link is invalid or has expired. <a href="/forgot-password.html">Request a new one.</a>
    </div>

    <div id="success-msg" class="success-msg" role="status" aria-live="polite"></div>
    <div id="error-msg"   class="error-msg"   role="alert"  aria-live="polite"></div>

    <form id="reset-form" novalidate>
      <label for="password">New Password</label>
      <input type="password" id="password" name="password" autocomplete="new-password" required aria-required="true" placeholder="Min 8 chars, 1 uppercase, 1 number" />

      <label for="confirm-password">Confirm Password</label>
      <input type="password" id="confirm-password" name="confirm-password" autocomplete="new-password" required aria-required="true" placeholder="Re-enter password" />

      <button type="submit" class="btn" aria-label="Reset password">Reset Password</button>
    </form>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const token  = params.get('token');

    if (!token) {
      document.getElementById('invalid-token').style.display = 'block';
      document.getElementById('reset-form').style.display = 'none';
    }

    async function getCsrfToken() {
      const res = await fetch('/api/auth/csrf-token', { credentials: 'include' });
      return (await res.json()).csrfToken;
    }

    document.getElementById('reset-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const successMsg = document.getElementById('success-msg');
      const errorMsg   = document.getElementById('error-msg');
      successMsg.style.display = 'none';
      errorMsg.style.display   = 'none';

      const password        = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirm-password').value;

      if (password !== confirmPassword) {
        errorMsg.textContent = 'Passwords do not match.';
        errorMsg.style.display = 'block';
        return;
      }

      try {
        const csrfToken = await getCsrfToken();
        const res = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': csrfToken },
          credentials: 'include',
          body: JSON.stringify({ token, password }),
        });
        const data = await res.json();
        if (res.ok) {
          successMsg.textContent = data.message + ' Redirecting to login...';
          successMsg.style.display = 'block';
          document.getElementById('reset-form').style.display = 'none';
          setTimeout(() => { window.location.href = '/index.html'; }, 2500);
        } else {
          errorMsg.textContent = data.error?.message || 'Password reset failed.';
          errorMsg.style.display = 'block';
        }
      } catch {
        errorMsg.textContent = 'Unable to connect to the server.';
        errorMsg.style.display = 'block';
      }
    });
  </script>
</body>
</html>
