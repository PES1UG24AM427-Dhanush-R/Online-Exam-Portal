<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teacher Dashboard — Online Exam Portal</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f0f4f8; color: #1a202c; }
    header { background: #276749; color: #fff; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 1.2rem; }
    .logout-btn { background: transparent; border: 1px solid #fff; color: #fff; padding: 0.4rem 0.9rem; border-radius: 5px; cursor: pointer; font-size: 0.9rem; }
    main { max-width: 1000px; margin: 2rem auto; padding: 0 1rem; }
    .actions { display: flex; gap: 1rem; margin-bottom: 2rem; }
    .btn { padding: 0.65rem 1.25rem; border: none; border-radius: 6px; cursor: pointer; font-size: 0.9rem; font-weight: 600; text-decoration: none; display: inline-block; }
    .btn-green  { background: #276749; color: #fff; }
    .btn-blue   { background: #3182ce; color: #fff; }
    .btn-orange { background: #dd6b20; color: #fff; }
    .btn:hover { opacity: 0.88; }
    .btn:focus { outline: 2px solid #2b6cb0; outline-offset: 2px; }
    .section { background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.07); padding: 1.5rem; margin-bottom: 2rem; }
    h2 { font-size: 1.1rem; margin-bottom: 1rem; color: #2d3748; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th, td { text-align: left; padding: 0.6rem 0.75rem; border-bottom: 1px solid #e2e8f0; }
    th { background: #edf2f7; font-weight: 600; }
    .badge { display: inline-block; padding: 0.2rem 0.6rem; border-radius: 12px; font-size: 0.78rem; font-weight: 600; }
    .badge-draft     { background: #e2e8f0; color: #4a5568; }
    .badge-published { background: #c6f6d5; color: #276749; }
    .badge-closed    { background: #fed7d7; color: #c53030; }
    .empty { color: #a0aec0; text-align: center; padding: 1.5rem 0; }
  </style>
</head>
<body>
  <header>
    <h1>Online Exam Portal — Teacher Dashboard</h1>
    <button class="logout-btn" id="logout-btn" aria-label="Log out">Log Out</button>
  </header>

  <main>
    <nav class="actions" aria-label="Teacher actions">
      <a href="/teacher/questions.html" class="btn btn-green" aria-label="Manage question bank">Question Bank</a>
      <a href="/teacher/exams.html" class="btn btn-blue" aria-label="Create or manage exams">Manage Exams</a>
      <a href="/teacher/grading.html" class="btn btn-orange" aria-label="Grade submissions">Grading Queue</a>
    </nav>

    <section class="section" aria-labelledby="exams-heading">
      <h2 id="exams-heading">My Exams</h2>
      <table aria-label="My exams">
        <thead>
          <tr><th>Title</th><th>Start</th><th>End</th><th>Duration</th><th>Questions</th><th>Status</th><th>Action</th></tr>
        </thead>
        <tbody id="exams-tbody"><tr><td colspan="7" class="empty">Loading...</td></tr></tbody>
      </table>
    </section>
  </main>

  <script>
    async function getCsrfToken() {
      const res = await fetch('/api/auth/csrf-token', { credentials: 'include' });
      const data = await res.json();
      return data.csrfToken;
    }

    async function loadExams() {
      const tbody = document.getElementById('exams-tbody');
      const res = await fetch('/api/exams', { credentials: 'include' });
      if (res.status === 401) { window.location.href = '/index.html'; return; }
      const data = await res.json();
      const exams = data.exams || [];

      if (!exams.length) {
        tbody.innerHTML = '<tr><td colspan="7" class="empty">No exams yet. Create your first exam.</td></tr>';
        return;
      }

      tbody.innerHTML = exams.map(e => {
        const badgeClass = `badge-${e.status}`;
        const publishBtn = e.status === 'draft'
          ? `<button class="btn btn-green" style="padding:0.3rem 0.7rem;font-size:0.8rem" onclick="publishExam(${e.id})" aria-label="Publish ${e.title}">Publish</button>`
          : '—';
        return `<tr>
          <td>${e.title}</td>
          <td>${new Date(e.start_datetime).toLocaleString()}</td>
          <td>${new Date(e.end_datetime).toLocaleString()}</td>
          <td>${e.duration_minutes} min</td>
          <td>${e.question_count}</td>
          <td><span class="badge ${badgeClass}">${e.status}</span></td>
          <td>${publishBtn}</td>
        </tr>`;
      }).join('');
    }

    async function publishExam(examId) {
      if (!confirm('Publish this exam? Students will be able to access it within the scheduled window.')) return;
      const csrfToken = await getCsrfToken();
      const res = await fetch(`/api/exams/${examId}/publish`, {
        method: 'PATCH',
        headers: { 'X-CSRF-Token': csrfToken },
        credentials: 'include',
      });
      const data = await res.json();
      alert(res.ok ? data.message : data.error?.message);
      if (res.ok) loadExams();
    }

    document.getElementById('logout-btn').addEventListener('click', async () => {
      const csrfToken = await getCsrfToken();
      await fetch('/api/auth/logout', { method: 'POST', headers: { 'X-CSRF-Token': csrfToken }, credentials: 'include' });
      window.location.href = '/index.html';
    });

    loadExams();
  </script>
</body>
</html>
