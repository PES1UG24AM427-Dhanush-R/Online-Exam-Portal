<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Exam — Online Exam Portal</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f0f4f8; color: #1a202c; }
    header { background: #276749; color: #fff; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 1.2rem; }
    .back-btn { background: transparent; border: 1px solid #fff; color: #fff; padding: 0.4rem 0.9rem; border-radius: 5px; cursor: pointer; font-size: 0.9rem; text-decoration: none; }
    main { max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
    .card { background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.07); padding: 1.75rem; margin-bottom: 2rem; }
    h2 { font-size: 1.1rem; margin-bottom: 1.25rem; color: #2d3748; }
    label { display: block; font-size: 0.875rem; font-weight: 600; margin-bottom: 0.3rem; margin-top: 0.85rem; }
    input[type=text], input[type=number], input[type=datetime-local] { width: 100%; padding: 0.55rem 0.75rem; border: 1px solid #cbd5e0; border-radius: 6px; font-size: 0.9rem; }
    input:focus { outline: 2px solid #4299e1; }
    .checkbox-row { display: flex; align-items: center; gap: 0.5rem; margin-top: 0.85rem; }
    .checkbox-row input { width: auto; accent-color: #3182ce; }
    .questions-picker { border: 1px solid #e2e8f0; border-radius: 6px; max-height: 300px; overflow-y: auto; padding: 0.5rem; }
    .q-row { display: flex; align-items: center; gap: 0.75rem; padding: 0.5rem; border-bottom: 1px solid #f0f4f8; }
    .q-row:last-child { border-bottom: none; }
    .q-row input[type=checkbox] { accent-color: #3182ce; width: auto; }
    .q-row .q-label { flex: 1; font-size: 0.875rem; }
    .q-row .marks-input { width: 70px; padding: 0.3rem 0.5rem; border: 1px solid #cbd5e0; border-radius: 4px; font-size: 0.85rem; }
    .btn { padding: 0.65rem 1.25rem; border: none; border-radius: 6px; cursor: pointer; font-size: 0.9rem; font-weight: 600; }
    .btn-green { background: #276749; color: #fff; margin-top: 1.25rem; width: 100%; }
    .btn:hover { opacity: 0.88; }
    .btn:focus { outline: 2px solid #2b6cb0; outline-offset: 2px; }
    .summary { font-size: 0.85rem; color: #718096; margin-top: 0.5rem; }
    .success-msg { color: #276749; background: #c6f6d5; padding: 0.6rem 0.75rem; border-radius: 6px; font-size: 0.85rem; margin-bottom: 0.75rem; display: none; }
    .error-msg   { color: #c53030; background: #fff5f5; padding: 0.6rem 0.75rem; border-radius: 6px; font-size: 0.85rem; margin-bottom: 0.75rem; display: none; }
    .empty { color: #a0aec0; text-align: center; padding: 1rem 0; font-size: 0.875rem; }
  </style>
</head>
<body>
  <header>
    <h1>Create Exam</h1>
    <a href="/teacher/dashboard.html" class="back-btn" aria-label="Back to dashboard">← Dashboard</a>
  </header>

  <main>
    <section class="card" aria-labelledby="create-heading">
      <h2 id="create-heading">New Exam</h2>
      <div id="form-success" class="success-msg" role="status" aria-live="polite"></div>
      <div id="form-error"   class="error-msg"   role="alert"  aria-live="polite"></div>

      <form id="exam-form" novalidate>
        <label for="title">Exam Title</label>
        <input type="text" id="title" aria-required="true" placeholder="e.g. Mid-term Mathematics" />

        <label for="duration">Duration (minutes)</label>
        <input type="number" id="duration" min="1" aria-required="true" placeholder="e.g. 60" />

        <label for="start">Start Date & Time</label>
        <input type="datetime-local" id="start" aria-required="true" />

        <label for="end">End Date & Time</label>
        <input type="datetime-local" id="end" aria-required="true" />

        <div class="checkbox-row">
          <input type="checkbox" id="shuffle" aria-label="Randomise question order" />
          <label for="shuffle" style="margin:0;font-weight:400">Randomise question order</label>
        </div>

        <label style="margin-top:1.25rem">Select Questions & Assign Marks</label>
        <div class="questions-picker" id="questions-picker" aria-label="Question picker">
          <p class="empty">Loading your questions...</p>
        </div>
        <p class="summary" id="selected-summary">0 questions selected — Total marks: 0</p>

        <button type="submit" class="btn btn-green" aria-label="Create exam">Create Exam</button>
      </form>
    </section>
  </main>

  <script>
    let allQuestions = [];

    async function getCsrfToken() {
      const res = await fetch('/api/auth/csrf-token', { credentials: 'include' });
      return (await res.json()).csrfToken;
    }

    async function loadQuestions() {
      const picker = document.getElementById('questions-picker');
      const res = await fetch('/api/questions', { credentials: 'include' });
      if (res.status === 401) { window.location.href = '/index.html'; return; }
      const data = await res.json();
      allQuestions = data.questions || [];

      if (!allQuestions.length) {
        picker.innerHTML = '<p class="empty">No questions in your bank. <a href="/teacher/questions.html">Add questions first.</a></p>';
        return;
      }

      picker.innerHTML = allQuestions.map(q =>
        `<div class="q-row">
          <input type="checkbox" id="q-${q.id}" value="${q.id}" aria-label="Select question: ${q.text.substring(0,40)}" onchange="updateSummary()" />
          <label for="q-${q.id}" class="q-label">${q.text.length > 70 ? q.text.substring(0,70)+'…' : q.text} <small>(${q.difficulty})</small></label>
          <input type="number" class="marks-input" id="marks-${q.id}" value="1" min="0.5" step="0.5" aria-label="Marks for this question" onchange="updateSummary()" />
        </div>`
      ).join('');
    }

    function updateSummary() {
      const selected = [...document.querySelectorAll('.q-row input[type=checkbox]:checked')];
      const total = selected.reduce((sum, cb) => {
        const marks = parseFloat(document.getElementById(`marks-${cb.value}`).value) || 0;
        return sum + marks;
      }, 0);
      document.getElementById('selected-summary').textContent =
        `${selected.length} question${selected.length !== 1 ? 's' : ''} selected — Total marks: ${total}`;
    }

    document.getElementById('exam-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const successMsg = document.getElementById('form-success');
      const errorMsg   = document.getElementById('form-error');
      successMsg.style.display = 'none';
      errorMsg.style.display   = 'none';

      const title           = document.getElementById('title').value.trim();
      const durationMinutes = parseInt(document.getElementById('duration').value);
      const startDatetime   = document.getElementById('start').value;
      const endDatetime     = document.getElementById('end').value;
      const shuffle         = document.getElementById('shuffle').checked;

      const selected = [...document.querySelectorAll('.q-row input[type=checkbox]:checked')];
      if (!selected.length) {
        errorMsg.textContent = 'Please select at least one question.';
        errorMsg.style.display = 'block';
        return;
      }

      const questions = selected.map(cb => ({
        questionId: parseInt(cb.value),
        marks: parseFloat(document.getElementById(`marks-${cb.value}`).value) || 1,
      }));

      try {
        const csrfToken = await getCsrfToken();
        const res = await fetch('/api/exams', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': csrfToken },
          credentials: 'include',
          body: JSON.stringify({ title, durationMinutes, startDatetime, endDatetime, shuffle, questions }),
        });
        const data = await res.json();
        if (!res.ok) {
          errorMsg.textContent = data.error?.details?.map(d => d.message).join(' ') || data.error?.message;
          errorMsg.style.display = 'block';
          return;
        }
        successMsg.textContent = `Exam "${title}" created successfully! Redirecting to dashboard...`;
        successMsg.style.display = 'block';
        setTimeout(() => { window.location.href = '/teacher/dashboard.html'; }, 2000);
      } catch {
        errorMsg.textContent = 'Failed to create exam.';
        errorMsg.style.display = 'block';
      }
    });

    loadQuestions();
  </script>
</body>
</html>
